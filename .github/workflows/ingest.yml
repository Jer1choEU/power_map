name: Ingest candidate
on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * 1'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ingest.mjs
      - run: node scripts/validate.mjs build/candidate.json
      - run: node scripts/coverage.mjs build/candidate.json > build/coverage.md
      - uses: actions/upload-artifact@v4
        with:
          name: power-map-candidate
          path: build/
          retention-days: 30
