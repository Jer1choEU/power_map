name: External corporate discovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover exact-ID companies
        env:
          OPENCORPORATES_API_TOKEN: ${{ secrets.OPENCORPORATES_API_TOKEN }}
          MAX_COMPANIES: '5'
        run: node scripts/discover-opencorporates.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencorporates-discovery
          path: build/opencorporates-candidates.json
          if-no-files-found: ignore
