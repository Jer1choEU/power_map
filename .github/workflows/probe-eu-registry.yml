name: Probe EU transparency official feed
on:
  pull_request:
    paths:
      - 'scripts/probe-eu-registry.mjs'
      - '.github/workflows/probe-eu-registry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-eu-registry.mjs
