name: Probe OCP ANAC archive
on:
  pull_request:
    paths:
      - 'scripts/probe-ocp.mjs'
      - '.github/workflows/probe-ocp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-ocp.mjs
