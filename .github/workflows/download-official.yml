name: Official downloads (review only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/download.test.mjs
      - run: node scripts/download-official.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: official-download-candidates
          path: build/downloads/
          if-no-files-found: ignore
          retention-days: 14
