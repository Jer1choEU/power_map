name: Validate datasets
on:
  push:
    paths:
      - 'data/**'
      - 'scripts/validate.mjs'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate.mjs'
      - '.github/workflows/validate.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs data/demo.json
      - run: node scripts/validate.mjs data/italia-2026.json
