name: Automatic ANAC OCDS intake and publication
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/import-ocp.mjs'
      - 'scripts/stage-ocp.mjs'
      - 'tests/ocp.test.mjs'
      - 'tests/ocp-publish.test.mjs'
      - 'data/schema.json'
      - '.github/workflows/ocp-ingest.yml'
  pull_request:
    paths:
      - 'scripts/import-ocp.mjs'
      - 'scripts/stage-ocp.mjs'
      - 'tests/ocp.test.mjs'
      - 'tests/ocp-publish.test.mjs'
      - 'scripts/validate.mjs'
      - 'data/schema.json'
      - '.github/workflows/ocp-ingest.yml'
permissions:
  contents: write
concurrency:
  group: ocp-anac-intake
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify extraction and automatic publication safety
        run: node --test tests/ocp.test.mjs tests/ocp-publish.test.mjs
      - name: Download and transform historical ANAC data from OCP
        run: node scripts/import-ocp.mjs --year 2025 --max-relations 1200 --output-dir build/ocp
      - name: Validate downloaded source-backed graph
        run: node scripts/validate.mjs build/ocp/candidate.json
      - name: Retain diagnostics and evidence
        uses: actions/upload-artifact@v4
        with:
          name: anac-ocp-validated-candidate
          path: build/ocp/
          retention-days: 30
      - name: Stage only verified and safe changes
        if: github.event_name != 'pull_request'
        run: node scripts/stage-ocp.mjs
      - name: Publish validated updates directly to main
        if: github.event_name != 'pull_request'
        run: |
          git add -- data/ocp-2025.json data/ocp-2025-report.json
          if git diff --cached --quiet; then
            echo 'No changes: archive already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: automatically refresh verified ANAC/OCP procurement archive'
            git push origin HEAD:main
            echo 'Verified ANAC/OCP dataset published to main.'
          fi
